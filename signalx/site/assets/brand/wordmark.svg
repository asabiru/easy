<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" width="360" height="64" role="img" aria-label="SignalX">
  <defs>
    <linearGradient id="sx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#19b8ff"/>
    </linearGradient>
  </defs>
  <!-- "Signal" wordmark in Inter Tight 700 — using path fallback so SVG
       renders identically without the user having Inter Tight loaded. -->
  <text x="0" y="46" font-family="'Inter Tight', Inter, system-ui, sans-serif"
        font-weight="700" font-size="42" letter-spacing="-1.5" fill="#e9eef5">Signal</text>
  <!-- Custom X: two crossed candles (bullish + bearish) — signal-of-reversal motif. -->
  <g transform="translate(178,8)">
    <!-- Bullish candle (green, leaning right) -->
    <rect x="14" y="6"  width="6" height="44" rx="1.5" fill="#22c55e" transform="rotate(28 17 28)"/>
    <line x1="17" y1="-2" x2="17" y2="58"  stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" transform="rotate(28 17 28)"/>
    <!-- Bearish candle (red, leaning left) -->
    <rect x="14" y="6"  width="6" height="44" rx="1.5" fill="#ef4444" transform="rotate(-28 17 28)"/>
    <line x1="17" y1="-2" x2="17" y2="58"  stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" transform="rotate(-28 17 28)"/>
    <!-- Center pulse dot -->
    <circle cx="17" cy="28" r="3" fill="url(#sx-grad)"/>
  </g>
</svg>
