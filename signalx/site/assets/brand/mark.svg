<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SignalX">
  <defs>
    <linearGradient id="sx-mark-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#19b8ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square chassis -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sx-mark-grad)"/>
  <!-- Inner darker plate so the mark glyphs read on any context background -->
  <rect x="6" y="6" width="52" height="52" rx="11" fill="#0e1116" opacity="0.92"/>
  <!-- S as a sine-wave (volatility curve) -->
  <path d="M16 24 Q24 14 32 24 T48 24" stroke="#19b8ff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- X as crossed candles, anchored center, ratio-locked to the S -->
  <g transform="translate(20,30)">
    <rect x="9" y="2"  width="6" height="22" rx="1.5" fill="#22c55e" transform="rotate(28 12 13)"/>
    <line x1="12" y1="-2" x2="12" y2="28" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" transform="rotate(28 12 13)"/>
    <rect x="9" y="2"  width="6" height="22" rx="1.5" fill="#ef4444" transform="rotate(-28 12 13)"/>
    <line x1="12" y1="-2" x2="12" y2="28" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" transform="rotate(-28 12 13)"/>
    <circle cx="12" cy="13" r="2.2" fill="#ffffff"/>
  </g>
</svg>
