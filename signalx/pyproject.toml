[project]
name = "signalx"
version = "0.1.0"
description = "SignalX — event-driven trading signals for tokenized stock perpetual futures"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "email-validator==2.2.0",
  "cryptography==43.0.1",
  "bcrypt==4.2.0",
  "PyJWT==2.9.0",
  "SQLAlchemy==2.0.35",
  "psycopg2-binary==2.9.9",
  "alembic==1.13.3",
  "celery==5.4.0",
  "redis==5.0.8",
  "ccxt==4.4.13",
  "httpx==0.27.2",
  "feedparser==6.0.11",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.10",
  "rapidfuzz==3.10.0",
  "python-telegram-bot==21.6",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
